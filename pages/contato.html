<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/style-geral.css">
    <link rel="stylesheet" href="../style/contato.css">
    <title>Contato - Last Charge</title>
</head>
<body>
    <!-- menu de cima logo na esquerda e os botao na direita -->
    <header class="navbar">
        <a href="../index.html">
            <img class="logo" src="../img/logo-last-charge.png" alt="Logo Last Charge">
        </a>
        <nav class="menu">
            <a class="caixa-menu" href="../index.html">Inicio</a>
            <a class="caixa-menu" href="produtos.html">Produtos</a>
            <a class="caixa-menu" href="sobre.html">Sobre</a>
            <a class="caixa-menu ativo" href="contato.html">Contato</a>
        </nav>
    </header>

    <main>
        <section class="secao">
            <h2 class="titulo-centro">Contato</h2>
            <p class="secao-intro texto-centro">Conte pra gente quem partiu.</p>

            <!-- o for do label tem que ser igual o id do campo -->
            <form class="formulario">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                <label for="email">E-mail</label>

                <input type="email" id="email" name="email" placeholder="voce@email.com" required>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="4" placeholder="Qual era o modelo? Do que ele morreu?"></textarea>

                <button class="botao" type="submit" >Enviar</button>
            </form>
        </section>
    </main>

    <!-- rodape -->
    <footer class="rodape">
        <p>Rafael Domingues - Cemitério de Celulares</p>
    </footer>
</body>
</html>
