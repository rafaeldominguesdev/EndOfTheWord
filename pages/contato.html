<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- aqui liga o bootstrap pela internet ele e um css pronto que ja vem com classes tipo btn -->
    <!-- coloquei so nessa pagina pra nao mudar o resto do site e tem que vir antes do meu css pro meu ganhar -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/style-geral.css">
    <link rel="stylesheet" href="../style/contato.css">
    <title>Contato - Last Charge</title>
</head>

<body>
    <!-- menu de cima logo na esquerda e os botao na direita -->
    <header class="navbar">
        <a href="../index.html">
            <img class="logo" src="../img/logo-last-charge.png" alt="Logo Last Charge">
        </a>
        <nav class="menu">
            <a class="caixa-menu" href="../index.html">Inicio</a>
            <a class="caixa-menu" href="produtos.html">Produtos</a>
            <a class="caixa-menu" href="sobre.html">Sobre</a>
            <a class="caixa-menu ativo" href="contato.html">Contato</a>
        </nav>
    </header>

    <section class="capa-contato">


        <main>
            <section class="secao">
                <h2 class="titulo-centro">Contato</h2>
                <p class="secao-intro texto-centro">Conte pra gente quem partiu.</p>

                <!-- o for do label tem que ser igual o id do campo -->
                <form class="formulario">
                    <label class="texto-fora" for="nome">Nome</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                    <label class="texto-fora" for="email">E-mail</label>

                    <input type="email" id="email" name="email" placeholder="voce@email.com" required>

                    <label class="texto-fora" for="mensagem">Mensagem</label>
                    <textarea id="mensagem" name="mensagem" rows="4"
                        placeholder="Qual era o modelo? Do que ele morreu?"></textarea>

                    <!-- botao do bootstrap btn deixa com cara de botao btn-warning e a cor amarela e btn-lg deixa grande -->
                    <button id="button-enviar" class="btn btn-warning btn-lg" type="submit">Enviar</button>
                </form>
            </section>
    </section>
    </main>

    <!-- rodape -->
    <footer class="rodape">
        <p>Rafael Domingues - Cemitério de Celulares</p>
    </footer>
</body>

</html>
